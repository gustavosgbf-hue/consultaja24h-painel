name: Install Memed auto-chat loader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-memed-auto-chat.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Memed auto-chat loader to medical panel
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="/memed-auto-chat.js?v=3"></script>'

          if tag in html:
              print('Memed auto-chat loader already installed.')
          else:
              if '</body>' not in html:
                  raise SystemExit('Could not find </body> in index.html')
              html = html.replace('</body>', f'{tag}\n</body>', 1)
              path.write_text(html, encoding='utf-8')
              print('Memed auto-chat loader installed.')
      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load Memed auto-chat automatically"
          git push origin HEAD:main
