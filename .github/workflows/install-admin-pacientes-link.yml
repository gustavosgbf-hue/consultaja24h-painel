name: Install admin patient blocking shortcut

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-admin-pacientes-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject admin patient tool script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="/admin-pacientes.js?v=1"></script>'
          if tag not in s:
              marker='<script src="/memed-open-fix-v4.js?v=8"></script>'
              if marker in s:
                  s=s.replace(marker, marker+'\n'+tag, 1)
              else:
                  s=s.replace('</body>', tag+'\n</body>', 1)
              p.write_text(s)
          PY
      - name: Commit panel integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Expose patient blocking tool in admin panel"
          git push
