name: Apply panel experience v3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-panel-experience-v3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link stylesheet safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if '/panel-experience-v3.css' not in s:
              anchor='</head>'
              assert anchor in s
              s=s.replace(anchor,'<link rel="stylesheet" href="/panel-experience-v3.css?v=3">\n'+anchor,1)
              p.write_text(s)
          print('panel experience linked')
          PY
      - name: Sanity check
        run: |
          grep -q '/panel-experience-v3.css?v=3' index.html
          test -f panel-experience-v3.css
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then git commit -m 'Wire panel experience v3'; git push; fi
