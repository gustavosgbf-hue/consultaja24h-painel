name: Temporary clinical verification

on:
  push:
    branches: [feature/paciente-longitudinal-prontuario]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check api-config.js
          node --check memed-auto-chat.js
          node --check memed-prontuario-guard.js
          node --check clinical-workspace.js
      - name: Diff check
        run: git diff --check origin/main...HEAD
