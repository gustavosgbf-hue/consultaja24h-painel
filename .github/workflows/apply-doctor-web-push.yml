name: Apply doctor web push
on:
  push:
    paths:
      - 'scripts/apply_doctor_web_push.py'
      - '.github/workflows/apply-doctor-web-push.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_doctor_web_push.py
      - run: grep -q 'CJ24H-DOCTOR-WEB-PUSH-V1' index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Enable doctor web push for patient messages'
          git push
